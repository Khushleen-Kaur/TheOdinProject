<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khushleen's Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <img src="" alt="">
        <div class="head">Khushleen's Library</div>
    </header>
    <main>
        <div class="container"></div>
        <div class="buttons">
            <button id="addBook" command="show-modal" commandfor="my-dialog">Add Book</button>
            
            <dialog id="my-dialog">
                <button commandfor="my-dialog" command="close" id="dialogCloseButton">X</button>
                <h1>Book Details:</h1>
                <form action="" id="myForm">
                    <div class="formData">
                        <label for="title">Enter Title: </label>
                        <input type="text" id="title">
                    </div>
                    <div class="formData">
                        <label for="author">Enter Author name: </label>
                        <input type="text" id="author">
                    </div>
                    <div class="formData">
                        <label for="pages">Enter Number of Pages: </label>
                        <input type="number" id="pages">
                    </div>
                    <div class="formData">
                        <label for="coverUrl">Enter Cover Page URL: </label>
                        <input type="text" id="coverUrl">
                    </div>
                    <input id="submitForm" type="submit">
                </form>
            </dialog>
        </div>
    </main>
    <footer>
        Thanks for visiting
    </footer>
    <!-- <button>↑</button> -->
    <script src="script.js"></script>
</body>

</html>
